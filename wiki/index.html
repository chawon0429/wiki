<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어둠탐사기록</title>
    <link rel="stylesheet" href="./wiki.css">
</head>
<body>

    <div class="container">
        <header class="header">
            
            
            <div class="logo-area">
                <div class="logo-icon">
                    <div class="eye-shape"></div>
                </div>
                <h1 class="logo-title"><span class="highlight-red">어둠</span>탐사기록</h1>
            </div>

            <div class="search-bar">
                <input type="text" class="search-input" disabled>
                <button class="search-btn">검색</button>
            </div>
        </header>

        <main class="content">
            <p class="category">어둠탐사기록 / 괴담</p>
            <h2 class="main-title">[심연교통공사에 어서오세요]</h2>
            
            <div class="utility-links">
                <span>읽기</span>
                <span>편집</span>
                <span>도구</span>
            </div>

            <table class="info-table">
                <tr>
                    <th>식별코드</th>
                    <td>Qterw-D-16</td>
                </tr>
                <tr>
                    <th>관리기관</th>
                    <td>(주)백일몽</td>
                </tr>
                <tr>
                    <th>분류</th>
                    <td>어둠</td>
                </tr>
                <tr>
                    <th>등급</th>
                    <td>어스름(D)</td>
                </tr>
            </table>

            <div class="description-box">
                <blockquote class="quote-text">
                    “ 잠들었다 깨어 보니 지하철 안.<br>
                    마치 퇴근길 같지만, 어딘가,<br>
                    이상한 역명들이 들려오기 시작한다-. ”
                </blockquote>

                <div class="main-text">
                    <p>&lt;<span class="highlight-red">어둠탐사기록</span>&gt;에 등장하는 괴담.</p>
                    <p><span class="highlight-red">백일몽 주식회사</span>의 식별코드는 Qterw-D-16.</p>
                    
                    <br>
                    <p>초창기에 작성된 <span class="highlight-red">어스름(D) 등급</span> 어둠 중 홀로 압도적인 탈출난이도를 자랑하는 미친 괴담.</p>
                    <p class="strikethrough">그러고 영원히 고통받는 <span class="highlight-red">현장탐사팀</span></p>
                    
                    <br>
                    <p>탐사는 총 56회까지 기록되었다.</p>
                </div>
            </div>
            
            <div class="spike-effect"></div>
        </main>
    </div>
