<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>어둠탐사기록 위키</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/NeoDunggeunmo.css"
    />
  </head>
  <body>
    <div class="container">
      <header class="main-banner" id="backToHome">
        <div class="header-top">
          <span class="icon-home">🏠</span>
          <span class="icon-info">ⓘ</span>
          <div class="header-pagination">▢▢▢▢▢▢▢▢▢▢▢▢▢▢▢▢</div>
          <span class="page-num">1</span>
        </div>
        <div class="logo-area">
          <div class="logo-icon"><div class="eye-shape"></div></div>
          <h1 class="logo-title">
            <span class="highlight-red">어둠</span>탐사기록
          </h1>
        </div>
      </header>

      <section id="homePage" class="page-section">
        <div class="search-section">
          <div class="search-bar">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="괴담 제목을 입력하세요..."
            />
            <button class="search-btn" id="searchBtn">검색</button>
          </div>
          <div class="sort-buttons">
            <button class="sort-btn active" id="sortByCode">코드순</button>
            <button class="sort-btn" id="sortByGrade">등급순</button>
          </div>
        </div>

        <ul class="wiki-list" id="wikiList"></ul>
      </section>

      <section id="detailPage" class="page-section hidden">
        <p class="category">어둠탐사기록 / 괴담</p>
        <h2 class="main-title" id="detailTitle">[심연교통공사에 어서오세요]</h2>

        <div class="utility-links">
          <span id="btnRead" class="active">읽기</span>
          <span id="btnEdit">편집</span>
          <span id="btnTool">도구</span>
          <span id="btnDelete">삭제</span>
        </div>

        <table class="info-table">
          <tr>
            <th>식별코드</th>
            <td id="detailCode">Qterw-D-16</td>
          </tr>
          <tr>
            <th>관리기관</th>
            <td id="detailAgency">(주)백일몽</td>
          </tr>
          <tr>
            <th>분류</th>
            <td id="detailCategory">어둠</td>
          </tr>
          <tr>
            <th>등급</th>
            <td id="detailGrade" class="highlight-red">어스름(D)</td>
          </tr>
        </table>

        <div class="description-box" id="viewModeArea">
          <blockquote class="quote-text" id="detailQuote">
            “ 잠들었다 깨어 보니 지하철 안... ”
          </blockquote>
          <div class="main-text" id="detailBody">본문 내용이 들어갑니다.</div>
        </div>

        <div class="edit-box hidden" id="editModeArea">
          <label for="editQuoteInput">인용구 편집 :</label>
          <textarea id="editQuoteInput" rows="2"></textarea>

          <label for="editBodyInput">본문 내용 편집 :</label>
          <textarea id="editBodyInput" rows="10"></textarea>

          <div class="edit-actions">
            <button class="save-btn" id="btnSave">저장하기</button>
            <button class="cancel-btn" id="btnCancel">취소</button>
          </div>
        </div>

        <div class="spike-effect"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
